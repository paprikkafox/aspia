syntax = "proto3";

option optimize_for = LITE_RUNTIME;

import "peer.proto";

package proto.key_exchange;

// 1. After the connection is established, the client sends message |ClientHello| to the server.
//    Field |methods| contains supported methods.
// 2. The server selects the preferred method and sends the message |ServerHello|.
//    Field |method| contains the selected method.
//
// Description of algorithms |ALGORITHM_SRP_*| (authentication and key exchange):
// 1. The client sends message |SrpIdentify| with field |username| containing the user name.
// 2. The server searches for a user who has the same username and sends a message
//    |SrpServerKeyExchange|.
//    Fields |number|, |generator|, |salt|, |B| contain the values stored in the user profile
//    (for more details see RFC 5054).
//    Field |iv| contains a random initialization vector specific to the encryption algorithm.
// 3. The client sends a message |SrpClientKeyExchange|.
//    Field |A| contains the calculated value.
//    Field |iv| contains a random initialization vector specific to the encryption algorithm.
//
//    Now the client and the server have encryption keys and initialization vectors. These keys
//    can be correct or incorrect. Authentication and key exchange are considered complete.
//    After the stage of authentication and exchange of keys, the authorization stage begins.
//
// Description of authorization:
// 1. The server sends the message |AuthorizationChallenge|. Field |session_types| contains the
//    allowed session types for the user. This message should be encrypted using the key and the
//    initialization vector received at the authentication stage.
// 2. The client decrypts the message from the server.
//    If the message can not be decrypted, then the user name and password entered are incorrect.
//    The client selects the session type from the offered by the server and sends the message
//    |AuthorizationResponse|. Field |session_type| contains the selected session type.
//

// Identification (authentication) methods. The value is also the bit index in the ClientHello
// capability mask |identify_methods|: bit (1 << method) is set when the client supports the method.
enum Identify
{
    IDENTIFY_SRP       = 0;
    IDENTIFY_ANONYMOUS = 1;

    // The client sends its credentials (PasswordIdentify) protected by the handshake key, so the
    // server can validate them against LDAP (with a local fallback).
    IDENTIFY_PASSWORD  = 2;
}

enum Encryption
{
    ENCRYPTION_UNKNOWN           = 0;
    ENCRYPTION_CHACHA20_POLY1305 = 1;
    ENCRYPTION_AES256_GCM        = 2;
}

// Client to server.
message ClientHello
{
    uint32 encryption    = 1;
    Identify identify    = 2;
    bytes public_key     = 3;
    bytes iv             = 4;
    peer.Version version = 5; // Deprecated.

    // Capability mask of the Identify methods the client supports (bit (1 << method)). Older clients
    // leave it zero and the server falls back to the single |identify| value. New clients keep
    // |identify| = IDENTIFY_SRP (so an old server still works) and list their capabilities here.
    uint32 identify_methods = 6;
}

// Server to client.
message ServerHello
{
    Encryption encryption = 1;
    bytes iv              = 2;
    bytes public_key      = 3;

    // The method the server selected among the client's advertised capabilities. Older clients
    // ignore the field and keep using the method they requested.
    Identify identify     = 4;
}

// Server to client (legacy protocol). Peers older than 3.0.0 require the server version in this
// message; the field takes the number that now carries public_key, the two share the wire type.
message ServerHelloLegacy
{
    Encryption encryption = 1;
    bytes iv              = 2;
    peer.Version version  = 3;
}

// Client to server.
message SrpIdentify
{
    string username = 1;
}

// Client to server (IDENTIFY_PASSWORD). Credentials travel inside a message encrypted with the
// handshake key (the ephemeral X25519 shared secret), never in the clear. |domain| is optional and
// may hold a Windows/AD domain for DOMAIN\user or user@domain logins.
message PasswordIdentify
{
    string domain   = 1;
    string username = 2;
    string password = 3;
}

// Server to client.
message SrpServerKeyExchange
{
    bytes number    = 1;
    bytes generator = 2;
    bytes salt      = 3;
    bytes B         = 4;
    bytes iv        = 5;
}

// Client to server.
message SrpClientKeyExchange
{
    bytes A  = 1;
    bytes iv = 2;
}

// Server to client.
message SessionChallenge
{
    peer.Version version = 1;
    uint32 session_types = 2;
    uint32 cpu_cores     = 3;
    string os_name       = 4;
    string computer_name = 5;
    string arch          = 6;
    string display_name  = 7;
}

// Client to server.
message SessionResponse
{
    peer.Version version = 1;
    uint32 session_type  = 2;
    uint32 cpu_cores     = 3;
    string os_name       = 4;
    string computer_name = 5;
    string arch          = 6;
    string display_name  = 7;
    bool probe           = 8;
}
